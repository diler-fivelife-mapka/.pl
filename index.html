<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Mapa</title>

  <!-- blokada normalnego zoomu -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #container {
      width: 100%;
      height: 100%;
      cursor: grab;
      overflow: hidden;
      position: relative;
    }

    img {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      transform-origin: center;
      user-select: none;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="container">
  <img src="mapa.png" id="mapa">
</div>

<script>
  const mapa = document.getElementById("mapa");
  const container = document.getElementById("container");

  let scale = 1;
  let posX = -50;
  let posY = -50;
  let isDragging = false;
  let startX, startY;

  // ZOOM (scroll)
  window.addEventListener("wheel", (e) => {
    e.preventDefault();

    scale += e.deltaY < 0 ? 0.1 : -0.1;
    scale = Math.min(Math.max(0.5, scale), 5);

    update();
  }, { passive: false });

  // DRAG (przesuwanie)
  container.addEventListener("mousedown", (e) => {
    isDragging = true;
    startX = e.clientX;
    startY = e.clientY;
    container.style.cursor = "grabbing";
  });

  window.addEventListener("mouseup", () => {
    isDragging = false;
    container.style.cursor = "grab";
  });

  window.addEventListener("mousemove", (e) => {
    if (!isDragging) return;

    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    posX += dx / 10;
    posY += dy / 10;

    startX = e.clientX;
    startY = e.clientY;

    update();
  });

  function update() {
    mapa.style.transform = `translate(${posX}%, ${posY}%) scale(${scale})`;
  }
</script>

</body>
</html>
