<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Mapa Dil</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html, body { margin:0; height:100%; overflow:hidden; font-family:Arial; }
#map { width:100%; height:100%; }

#topbar {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 9999;
  background: white;
  padding: 10px;
  border-radius: 8px;
}

#panel {
  position: fixed;
  right: 10px;
  top: 10px;
  background: rgba(0,0,0,0.7);
  color: white;
  padding: 10px;
  border-radius: 8px;
  z-index: 9999;
  width: 220px;
}
</style>
</head>
<body>

<div id="topbar">
  <input id="search" placeholder="Szukaj..." />
  <div id="counter">0 punktów</div>
</div>

<div id="panel">
  <div><b>Aktualny Diler</b></div>
  <div id="dealer">Brak</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>

<script>
const map = L.map('map', { crs: L.CRS.Simple, minZoom: -1, maxZoom: 3 });

const bounds = [[0,0],[1000,1000]];
L.imageOverlay('img/mapa.jpg', bounds).addTo(map);
map.fitBounds(bounds);

// MARKERY
const markerMap = {};

markers.forEach(m => {
  const marker = L.circleMarker([m.lat, m.lng], {
    radius: 7,
    color: m.color || "blue"
  }).addTo(map);

  marker.bindPopup(`<b>${m.name}</b>`);
  markerMap[m.name] = marker;
});

// LICZNIK
document.getElementById("counter").innerText = markers.length + " punktów";

// WYSZUKIWANIE
document.getElementById("search").addEventListener("input", (e) => {
  const val = e.target.value.toLowerCase();
  const found = markers.find(m => m.name.toLowerCase().includes(val));
  if (found) {
    map.setView([found.lat, found.lng], 2);
    markerMap[found.name].openPopup();
  }
});

// DEALER (demo)
function setDealer(name) {
  document.getElementById("dealer").innerText = name;
}

// test
setTimeout(() => setDealer("Warsztat Centralny"), 2000);
</script>

</body>
</html>
