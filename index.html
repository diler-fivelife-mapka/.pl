<!DOCTYPE html>

<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Mapa</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>
    body {
      margin: 0;
    }

    #map {
      width: 100vw;
      height: 100vh;
      background: black;
    }
  </style>

</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
  const map = L.map('map', {
    crs: L.CRS.Simple,
    minZoom: -2
  });

  // 🔴 TU WPISZ ROZMIAR SWOJEJ MAPY
  const width = 1080;
  const height = 1620;

  const bounds = [[0, 0], [height, width]];

  // 🔴 TU WPISZ NAZWĘ SWOJEGO PLIKU
  L.imageOverlay('mapa.jpg', bounds).addTo(map);

  map.fitBounds(bounds);
</script>

</body>
</html>
