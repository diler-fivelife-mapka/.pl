<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Mapa</title>

  <!-- wyłączamy domyślny zoom -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #container {
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: grab;
    }

    img {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      transform-origin: center;
      user-select: none;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="container">
  <img src="mapa.png" id="mapa">
</div>

<script>
  const mapa = document.getElementById("mapa");

  let scale = 1;

  window.addEventListener("wheel", (e) => {
    e.preventDefault();

    if (e.deltaY < 0) {
      scale += 0.1;
    } else {
      scale -= 0.1;
    }

    scale = Math.min(Math.max(0.5, scale), 5);

    mapa.style.transform = `translate(-50%, -50%) scale(${scale})`;
  }, { passive: false });
</script>

</body>
</html>
